<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Add inventory</title><link rel="stylesheet" href="/css/app.css"></head>
<body class="dashboard-body">
<header class="topbar"><a class="brand" href="/home">Inventory Hub</a><a class="nav-link" href="/inventory">← Inventory</a></header>
<main class="form-page">
    <section class="form-panel"><p class="eyebrow">ADMINISTRATOR</p><h1>Add inventory</h1><p>Create a new item in the catalogue.</p>
        <p class="error" th:if="${error != null}" th:text="${error}"></p>
        <form method="post" action="/inventory/add" class="inventory-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label>SKU<input name="sku" required maxlength="80" placeholder="e.g. FX-1001"></label>
            <label>Product name<input name="name" required maxlength="160" placeholder="e.g. Trading workstation"></label>
            <label>Opening quantity<input name="quantity" type="number" min="0" required value="0"></label>
            <label>Description<textarea name="description" maxlength="500" rows="4" placeholder="Optional product details"></textarea></label>
            <div class="form-actions"><a class="text-link" href="/inventory">Cancel</a><button type="submit">Save item</button></div>
        </form>
    </section>
</main>
</body></html>
