<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Manage users</title><link rel="stylesheet" href="/css/app.css"></head>
<body class="dashboard-body">
<header class="topbar"><a class="brand" href="/home">Inventory Hub</a><a class="nav-link" href="/home">← Home</a></header>
<main class="dashboard">
    <p class="eyebrow">ADMINISTRATOR</p><h1>User roles</h1><p>Only administrators can access this page and change authorization roles.</p>
    <p class="success banner" th:if="${param.updated != null}">Role updated successfully.</p>
    <p class="error banner" th:if="${param.error != null}">The final administrator cannot remove their own admin role.</p>
    <div class="table-shell"><table>
        <thead><tr><th>User</th><th>Email</th><th>Current role</th><th>Change role</th></tr></thead>
        <tbody><tr th:each="account : ${users}">
            <td th:text="${account.displayName}"></td><td th:text="${account.email}"></td><td><span class="role-badge" th:text="${account.role}"></span></td>
            <td><form class="role-form" method="post" th:action="@{/admin/users/{id}/role(id=${account.id})}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <select name="role"><option th:each="role : ${roles}" th:value="${role}" th:text="${role}" th:selected="${role == account.role}"></option></select>
                <button type="submit">Update</button>
            </form></td>
        </tr></tbody>
    </table></div>
</main>
</body></html>
