server:
  port: ${SERVER_PORT:8092}

spring:
  application:
    name: catalog-service
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/catalog;AUTO_SERVER=TRUE}
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  jwt-secret: ${JWT_SECRET:demomart-local-secret-change-before-production-2026}
  internal-service-key: ${INTERNAL_SERVICE_KEY:demomart-internal-service-key-local-only}

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8762/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
