name: demomart

x-java-service: &java-service
  restart: unless-stopped
  networks:
    - demomart
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp
  user: "${DEMOMART_UID:?DEMOMART_UID is required}:${DEMOMART_GID:?DEMOMART_GID is required}"

x-eureka-client: &eureka-client
  EUREKA_URL: http://service-registry:8762/eureka/

services:
  service-registry:
    <<: *java-service
    image: demomart/service-registry:${IMAGE_TAG:?IMAGE_TAG is required}
    build:
      context: ..
      dockerfile: docker/java-runtime.Dockerfile
      args:
        JAR_FILE: artifacts/service-registry.jar
    environment:
      SERVER_PORT: "8762"
      JAVA_TOOL_OPTIONS: -Xms32m -Xmx96m -XX:MaxMetaspaceSize=96m -XX:+ExitOnOutOfMemoryError
    mem_limit: 224m
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8762/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 18

  identity-service:
    <<: *java-service
    image: demomart/identity-service:${IMAGE_TAG:?IMAGE_TAG is required}
    build:
      context: ..
      dockerfile: docker/java-runtime.Dockerfile
      args:
        JAR_FILE: artifacts/identity-service.jar
    environment:
      <<: *eureka-client
      SERVER_PORT: "8091"
      DB_URL: jdbc:h2:file:/app/data/identity;AUTO_SERVER=TRUE
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SEED_DEMO_USERS: "false"
      JAVA_TOOL_OPTIONS: -Xms32m -Xmx160m -XX:MaxMetaspaceSize=96m -XX:+ExitOnOutOfMemoryError
    volumes:
      - /var/lib/demomart/identity:/app/data
    depends_on:
      service-registry:
        condition: service_healthy
    mem_limit: 288m
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8091/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 18

  catalog-service:
    <<: *java-service
    image: demomart/catalog-service:${IMAGE_TAG:?IMAGE_TAG is required}
    build:
      context: ..
      dockerfile: docker/java-runtime.Dockerfile
      args:
        JAR_FILE: artifacts/catalog-service.jar
    environment:
      <<: *eureka-client
      SERVER_PORT: "8092"
      DB_URL: jdbc:h2:file:/app/data/catalog;AUTO_SERVER=TRUE
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY is required}
      JAVA_TOOL_OPTIONS: -Xms32m -Xmx160m -XX:MaxMetaspaceSize=96m -XX:+ExitOnOutOfMemoryError
    volumes:
      - /var/lib/demomart/catalog:/app/data
    depends_on:
      service-registry:
        condition: service_healthy
    mem_limit: 288m
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8092/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 18

  order-service:
    <<: *java-service
    image: demomart/order-service:${IMAGE_TAG:?IMAGE_TAG is required}
    build:
      context: ..
      dockerfile: docker/java-runtime.Dockerfile
      args:
        JAR_FILE: artifacts/order-service.jar
    environment:
      <<: *eureka-client
      SERVER_PORT: "8093"
      DB_URL: jdbc:h2:file:/app/data/orders;AUTO_SERVER=TRUE
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY is required}
      JAVA_TOOL_OPTIONS: -Xms32m -Xmx160m -XX:MaxMetaspaceSize=96m -XX:+ExitOnOutOfMemoryError
    volumes:
      - /var/lib/demomart/orders:/app/data
    depends_on:
      service-registry:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    mem_limit: 288m
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8093/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 18

  api-gateway:
    <<: *java-service
    image: demomart/api-gateway:${IMAGE_TAG:?IMAGE_TAG is required}
    build:
      context: ..
      dockerfile: docker/java-runtime.Dockerfile
      args:
        JAR_FILE: artifacts/api-gateway.jar
    environment:
      <<: *eureka-client
      SERVER_PORT: "8090"
      JAVA_TOOL_OPTIONS: -Xms32m -Xmx128m -XX:MaxMetaspaceSize=96m -XX:+ExitOnOutOfMemoryError
    depends_on:
      service-registry:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8090/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 18

  frontend:
    image: demomart/frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    build:
      context: ..
      dockerfile: docker/frontend-runtime.Dockerfile
    restart: unless-stopped
    networks:
      - demomart
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      api-gateway:
        condition: service_healthy
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 12

networks:
  demomart:
    driver: bridge

