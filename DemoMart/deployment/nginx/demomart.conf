# This file is installed in /etc/nginx/default.d on Amazon Linux 2023.
# The existing default port-80 server includes that directory, so these
# locations coexist with the file-upload application's location / route.

location = /demomart {
    return 301 /demomart/;
}

location ^~ /demomart/ {
    # Remove /demomart/ before forwarding. The frontend container serves the
    # React application and proxies /api/ to the private API Gateway container.
    proxy_pass http://127.0.0.1:8088/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
}
