spring:
  application:
    name: local-file-upload-demo
  servlet:
    multipart:
      max-file-size: 999MB
      max-request-size: 999MB

app:
  storage:
    # Override with the FILE_STORAGE_LOCATION environment variable.
    location: ${FILE_STORAGE_LOCATION:./uploads}

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
